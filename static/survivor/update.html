<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Clear Sky</title>
  <link rel="stylesheet" href="/survivor/install.css">
</head>
<body>
  <main>
    <p class="eyebrow">Clear Sky</p>
    <h1>Update your app</h1>
    <p>Download the latest app screens. This needs a connection and does not remove saved entries, pending alerts, or your device connection.</p>
    <p>Finish any unsaved typing in other Clear Sky windows first. Other open windows will not reload automatically.</p>
    <button type="button" id="update-app">Update app files</button>
    <p id="update-status" role="status" aria-live="polite"></p>
    <a id="open-app" href="/survivor/?updated=1" hidden>Open updated app</a>
  </main>
  <script src="/survivor/update.js" defer></script>
</body>
</html>
