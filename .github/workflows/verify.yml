name: Verify isolated engineering release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements-lock.txt -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: node --test tests/*.cjs
      - run: python -m playwright install --with-deps chromium
      - name: Isolated browser regressions (fake providers only)
        run: |
          python tests/pwa_design_browser.py
          python tests/stage11_csp_browser.py
          python tests/weather_tap_browser.py
          python tests/stage2_pwa_browser.py
          python tests/stage5_pwa_browser.py
          python tests/stage9_vault_browser.py
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-security.txt
      - run: mkdir -p security-reports
      - name: Static scan (bandit) and tracked credential gate
        run: python tools/security_gate.py --run-bandit security-reports/bandit.json --secret-scan
      - name: Dependency advisories (no ignored findings or skipped packages)
        run: |
          python -m pip install --dry-run --ignore-installed -r requirements-lock.txt -r requirements.txt --report "$RUNNER_TEMP/runtime-resolution.json"
          python tools/security_gate.py --resolution-report "$RUNNER_TEMP/runtime-resolution.json"
          pip-audit -r requirements-lock.txt --no-deps --disable-pip --strict --format json --output security-reports/dependencies.json
          python tools/security_gate.py --dependency-report security-reports/dependencies.json
      - name: Dependency SBOM (CycloneDX)
        run: |
          pip-audit -r requirements-lock.txt --no-deps --disable-pip --strict --format cyclonedx-json --output security-reports/sbom.cdx.json
          python tools/security_gate.py --sbom security-reports/sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: dependency-and-static-reports
          path: security-reports/*.json
          retention-days: 14
