name: Verify isolated engineering release
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  secret-scan:
    name: Secret and private-file guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - run: python tools/install_gitleaks.py
      - name: Secret-guard regression checks using fictional fixtures
        run: python -m unittest discover -s tests -p 'test_secret_guard.py'
      - name: Scan every reachable file version without exposing matched values
        run: python tools/check_secrets.py --history
  regression:
    needs: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # The isolated rollback fixture needs stage-11-complete.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false # Preserve explicit-only dependency caching.
      - run: python tools/install_dependencies.py --profile dev
      - run: python tools/install_gitleaks.py
      - run: python tools/security_gate.py --lock-check
      - run: python -m pip check
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: node --test tests/*.cjs
      - run: python -m playwright install --with-deps chromium
      - run: npm ci --prefix tools/a11y --ignore-scripts --no-audit --no-fund
      - run: npm audit --prefix tools/a11y --audit-level=moderate
      - name: Isolated browser regressions (fake providers only)
        run: |
          python tests/staff_invitation_browser.py
          python tests/password_recovery_browser.py
          python tests/pwa_design_browser.py
          python tests/stage11_csp_browser.py
          python tests/weather_tap_browser.py
          python tests/followup_privacy_browser.py
          python tests/weather_data_boundary_browser.py
          python tests/stage2_pwa_browser.py
          python tests/stage5_pwa_browser.py
          python tests/stage9_vault_browser.py
          python tests/stage12_accessibility_browser.py
          python tests/stage12_load_browser.py
  security:
    needs: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - run: python tools/install_dependencies.py --profile security
      - run: python -m pip install --require-hashes -r requirements-build-lock.txt
      - run: mkdir -p security-reports
      - name: Static scan (bandit) and tracked credential gate
        run: python tools/security_gate.py --run-bandit security-reports/bandit.json --secret-scan
      - name: Dependency advisories (no ignored findings or skipped packages)
        run: |
          python -m pip install --dry-run --ignore-installed --no-build-isolation --require-hashes -r requirements-lock.txt --report "$RUNNER_TEMP/runtime-resolution.json"
          python tools/security_gate.py --resolution-report "$RUNNER_TEMP/runtime-resolution.json"
          pip-audit -r requirements-lock.txt --no-deps --disable-pip --strict --format json --output security-reports/dependencies.json
          python tools/security_gate.py --dependency-report security-reports/dependencies.json
      - name: Dependency SBOM (CycloneDX)
        run: |
          pip-audit -r requirements-lock.txt --no-deps --disable-pip --strict --format cyclonedx-json --output security-reports/sbom.cdx.json
          python tools/security_gate.py --sbom security-reports/sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dependency-reports
          path: |
            security-reports/dependencies.json
            security-reports/sbom.cdx.json
          retention-days: 14
