<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="same-origin"><meta name="color-scheme" content="light dark">
<title>Welcome · Avenra</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
<script src="{{ url_for('static', filename='js/staff-activate.js') }}" defer></script>
</head><body><main><section class="login-panel" aria-labelledby="activation-heading">
<div class="brand"><img class="logo-light" src="{{ url_for('static', filename='images/avenra-logo.png') }}" alt="Avenra" width="300" height="110"><img class="logo-dark" src="{{ url_for('static', filename='images/avenra-logo-dark.png') }}" alt="Avenra" width="300" height="110"></div>
<h1 id="activation-heading">Welcome to Avenra</h1>
<p class="intro">Create your password to enter your organisation’s workspace.</p>
{% if error %}<p class="error-banner" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="{{ url_for('staff_invitation.accept') }}">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<input type="hidden" name="token" id="invite-token" value="{{ request.form.get('token','') if request.method == 'POST' else '' }}">
<div class="field"><label for="password">Create password</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="15" maxlength="128" required></div>
<div class="field"><label for="confirm-password">Confirm password</label><input id="confirm-password" name="confirm_password" type="password" autocomplete="new-password" minlength="15" maxlength="128" required></div>
<p class="access-note">Use at least 15 characters. A long, unique passphrase works well.</p>
<button class="sign-in" type="submit">Activate account</button>
</form><noscript><p>Enable JavaScript to open the invitation securely.</p></noscript>
<p><a href="{{ url_for('login') }}">Already activated? Sign in</a></p>
</section></main></body></html>
