# Persistent backend profile: deploying creates PAID compute and disk.
# Review the price in Render first. This is not a production-readiness approval.
services:
  - type: web
    name: avenra
    runtime: python
    plan: 0.5c-512mb
    buildCommand: python tools/install_dependencies.py
    startCommand: python -m avenra.runtime
    healthCheckPath: /health
    disk:
      name: avenra-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: COOKIE_SECURE
        value: "1"
      - key: DATABASE_PATH
        value: /var/data/avenra.sqlite3
      - key: UPLOADS_DIR
        value: /var/data/uploads
      - key: DEVICE_TOKEN
        generateValue: true
