title = "Avenra credential scanning"

[extend]
useDefault = true

# Only these exact public source expressions are exempted from the generic
# heuristic. No test directory, commit, token prefix or private key is exempted.
[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Public localStorage exit flag name, not an authorization credential"
condition = "AND"
paths = ['''(?:^|/)static/survivor/shell\.js\.scan$''']
regexes = ['''^clear-sky-exited-v1$''']

[[rules.allowlists]]
description = "Python keyword argument using the public cursor lifetime constant"
condition = "AND"
paths = ['''(?:^|/)avenra/services/diary_service\.py\.scan$''']
regexes = ['''^max_age=self\.CURSOR_MAX_AGE$''']

[[rules]]
id = "avenra-private-key-header"
description = "Private key material, including encrypted and legacy keys"
regex = '''-----BEGIN (?:[A-Z0-9]+ )*PRIVATE KEY(?: BLOCK)?-----'''
keywords = ["private key"]

[[rules]]
id = "avenra-database-credentials"
description = "Database URI with an embedded password"
regex = '''(?i)(?:postgres(?:ql)?|mysql|mongodb(?:\+srv)?|redis(?:s)?)://[^\s'"/:]+:[^\s'"@]+@'''
keywords = ["postgres", "mysql", "mongodb", "redis"]

[[rules]]
id = "avenra-supabase-secret"
description = "Supabase secret or management token"
regex = '''\b(?:sb_secret_[A-Za-z0-9_-]{20,}|sbp_[a-f0-9]{40})\b'''
keywords = ["sb_secret_", "sbp_"]
